client:
  id: acme-fixture
  name: Acme Fixture
source:
  type: local
  path: ./acme-ds
ingestion:
  components:
    - extractor: react-tsx
      include: ["src/components/**/*.tsx"]
  tokens:
    - extractor: css-variables
      include: ["src/styles/**/*.css"]
      modes: { ":root": light, ".dark": dark }
    - extractor: tailwind-theme
      include: ["tailwind.config.ts"]
    - extractor: dtcg-json
      include: ["tokens/**/*.json"]
      mode: light
  defaultMode: light
  manifest:
    path: components.json
    itemsPath: components
    fields: { id: key, name: title, files: paths, status: lifecycle, category: group, notes: [a11y] }
  specs:
    include: ["specs/*.agent.json"]
    sourceField: source
    idField: id
    fields:
      lifecycle: status
      intent: intent
      description: description
      forbiddenUsage: rules.forbiddenUsage
      agentRules: rules.agentRules
      structure: structure
      accessibility: a11y
      related: related
      knownGaps: gaps
      props: props
      exports: exports
  docs:
    components: ["docs/**/*.md"]
    tokens: ["docs/tokens.md"]
  placeholders: [TBD, TODO]
  foundation:
    files: ["src/styles/tokens.css", "tailwind.config.ts"]
    packages: [tailwindcss]
  tokenSemantics:
    path: design/semantic.json
    rolesPath: roles
    roleFields: { token: name, meaning: means }
    decisionsPath: table
    forbiddenPath: never
  patterns:
    include: ["design/patterns/*.json"]
    fields: { id: id, name: title, intent: purpose, requiredComponents: uses, sequence: steps, rules: do, forbidden: dont }
  governance:
    rules:
      - include: ["design/rules.json"]
        itemsPath: rules
        category: core
        fields: { id: id, rule: text, severity: level, response: say }
      - include: ["design/rules.json"]
        itemsPath: a11y
        category: accessibility
        severity: medium
    approvedImports: ["@/components/", "@/lib/"]
    restrictedPackages: ["@mui/*", "@chakra-ui/*"]
    checks:
      restricted-package: NO_THIRD_PARTY_UI
      unindexed-component: INDEXED_ONLY
      raw-color: NO_RAW_COLORS
      palette-utility: NO_RAW_COLORS
      invalid-prop-value: VALID_PROPS
      compound-structure: PARTS_IN_PARENT
      base-mutation: NO_BASE_EDITS
      bespoke-duplicate: INDEXED_ONLY
      made-up-check: NO_RAW_COLORS
escalation:
  reviewers: [acme-ds-team]
