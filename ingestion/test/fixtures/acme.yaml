client:
  id: acme-fixture
  name: Acme Fixture
source:
  type: local
  path: ./acme-ds
ingestion:
  components:
    - extractor: react-tsx
      include: ["src/components/**/*.tsx"]
  tokens:
    - extractor: css-variables
      include: ["src/styles/**/*.css"]
      modes: { ":root": light, ".dark": dark }
    - extractor: tailwind-theme
      include: ["tailwind.config.ts"]
    - extractor: dtcg-json
      include: ["tokens/**/*.json"]
      mode: light
  defaultMode: light
  manifest:
    path: components.json
    itemsPath: components
    fields: { id: key, name: title, files: paths, status: lifecycle, category: group, notes: [a11y] }
  specs:
    include: ["specs/*.agent.json"]
    sourceField: source
    idField: id
    fields:
      lifecycle: status
      intent: intent
      description: description
      forbiddenUsage: rules.forbiddenUsage
      agentRules: rules.agentRules
      structure: structure
      accessibility: a11y
      related: related
      knownGaps: gaps
      props: props
      exports: exports
  docs:
    components: ["docs/**/*.md"]
    tokens: ["docs/tokens.md"]
  placeholders: [TBD, TODO]
  foundation:
    files: ["src/styles/tokens.css", "tailwind.config.ts"]
    packages: [tailwindcss]
