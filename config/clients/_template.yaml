# Copy to config/clients/<client-id>.yaml and fill in.
# Validate with: npm run docent -- check-config --client <client-id>
client:
  id: acme            # lowercase, digits, dashes; names the contracts/ and logs/ folders
  name: Acme Design System

# Which specialists this client gets. Leave out any the design system has no data for.
# specialists: [components, tokens, patterns, governance]

source:
  # Either a git repo Docent clones (shallow, read-only)…
  type: git
  url: https://github.com/acme/design-system.git
  ref: main
  # subdir: packages/ui   # if the design system lives inside a monorepo
  # githubAccess: repo-connector        # private repo: fetch with a short-lived read-only token from repo-connector
  # repoConnectorClientId: docent:acme  #   one per GitHub org or account; approved in the connector's /admin
  #
  # …or a checkout already on disk:
  # type: local
  # path: ../acme-design-system

ingestion:
  components:
    - extractor: react-tsx
      include: ["src/components/**/*.tsx"]
      exclude: ["**/*.stories.tsx", "**/*.test.tsx"]
      # importPath: "@acme/ui"                 # a package import, or
      # importPath: "@/components/{basename}"  # a per-file template

  tokens:
    # Pick whichever match how the client stores tokens; several can be combined.
    - extractor: css-variables
      include: ["src/styles/tokens.css"]
      modes:
        ":root": light
        "[data-theme='dark']": dark
    # Tailwind v4: map @theme too; its variables become utilities (--color-brand -> bg-brand).
    # - extractor: css-variables
    #   include: ["src/styles/tokens.css", "src/index.css"]
    #   modes: { "@theme": base, ":root": base, ".dark": dark }
    # - extractor: tailwind-theme
    #   include: ["tailwind.config.{js,ts,cjs,mjs}"]
    # - extractor: dtcg-json            # W3C design tokens / Style Dictionary JSON
    #   include: ["tokens/**/*.json"]
    #   mode: light

  defaultMode: light

  # Optional: the client's own machine-readable component inventory.
  # manifest:
  #   path: components.json
  #   itemsPath: components
  #   fields: { id: id, name: name, files: files, status: status, category: category, notes: [description] }

  docs:
    components: ["docs/components/**/*.md"]
    tokens: ["docs/tokens/**/*.md"]

  placeholders: [TBD, TODO, Unknown, N/A]

  # Optional: semantic token roles and "need -> use" guidance.
  # tokenSemantics:
  #   path: tokens/semantic.json
  #   rolesPath: roles
  #   roleFields: { token: token, meaning: meaning }
  #   decisionsPath: decisionTable
  #   forbiddenPath: forbidden

  # Optional: composition patterns, one JSON file each (or an array with itemsPath).
  # patterns:
  #   include: ["patterns/*.json"]
  #   fields: { id: name, intent: intent, requiredComponents: requiredComponents, sequence: sequence, rules: requiredRules, forbidden: forbiddenRules }

  # Optional: governance rules, and which rule each of Docent's checks enforces.
  # governance:
  #   rules:
  #     - include: ["rules/forbidden.json"]
  #       itemsPath: forbidden
  #       category: forbidden
  #       fields: { id: id, rule: rule, severity: severity, response: agentResponse }
  #     - include: ["AGENTS.md"]            # or rules kept as a markdown bullet list
  #       heading: Rules of the road
  #       category: rules
  #       severity: high                     # rule ids become rules-1, rules-2, ...
  #   agreedRules:                           # rules the owner agreed that aren't written in the repo
  #     - id: NO_THIRD_PARTY_UI
  #       rule: Never add a third-party UI kit such as Material UI or Chakra.
  #       severity: critical
  #       agreedBy: Jane Doe (design-system owner), 2026-09-11
  #   approvedImports: ["@/components/", "@/lib/"]
  #   restrictedPackages: ["@mui/*", "antd", "@chakra-ui/*"]
  #   checks:
  #     restricted-package: NO_THIRD_PARTY_UI
  #     unindexed-component: ONLY_INDEXED_COMPONENTS
  #     raw-color: NO_RAW_COLORS
  #     palette-utility: NO_RAW_COLORS
  #     invalid-prop-value: VALID_PROPS_ONLY
  #     compound-structure: PARTS_INSIDE_PARENT

# What governance findings lead to. These are the defaults.
# escalation:
#   onViolation: { critical: reject, high: escalate, medium: warn, low: warn, unspecified: warn }
#   onPossibleViolation: warn      # a request that only resembles a critical/high rule
#   onExceptionRequest: escalate   # a request to bypass a rule
#   reviewers: ["Acme design-system team"]
